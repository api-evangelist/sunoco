description: >-
  Sunoco LP (NYSE: SUN) is a master limited partnership and the premier independent fuel distributor in the United States,
  distributing over 15 billion gallons of fuel annually to approximately 11,000 Sunoco and partner-branded retail locations
  and operating more than 160 terminals. Sunoco LP is affiliated with Energy Transfer (parent of Sunoco GP, the general partner).
  On November 3, 2025 Sunoco closed its $9.1 billion acquisition of Parkland Corporation (announced May 5, 2025), creating
  SunocoCorp LLC, which began trading on the NYSE under ticker "SUNC". The Parkland acquisition substantially expands
  Sunoco's footprint into Canada and additional international markets, adding Parkland's refining, retail, and commercial
  fuels businesses to Sunoco's North American distribution network.
